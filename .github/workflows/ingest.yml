name: Daily ingest

on:
  schedule:
    # GitHub cron uses UTC. Both hours are scheduled; the timezone guard below
    # runs exactly one at 06:00 America/New_York across DST changes.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: Run weekly sources too
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern Time schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "$(TZ=America/New_York date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.schedule.outputs.run == 'true'

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.11.13"
          cache: pip

      - name: Install pinned dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Run fault-isolated ingest
        if: steps.schedule.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: python -m ingest.run

      - name: Open or update failure issue
        if: steps.schedule.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/failure_issue.py
